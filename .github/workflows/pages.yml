name: Tests und GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      index_sha256: ${{ steps.hash.outputs.index_sha256 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # Fingerabdruck des Builds: Der Smoke-Test wartet, bis genau diese index.html live ist
      - id: hash
        run: echo "index_sha256=$(sha256sum < dist/index.html | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Smoke-Test gegen die Live-Seite: richtige Version, lädt ohne Fehler, rechnet, Service Worker, Menü-Links
  smoke:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:smoke -- "${{ needs.deploy.outputs.page_url }}"
        env:
          EXPECT_INDEX_SHA256: ${{ needs.build.outputs.index_sha256 }}
